limit_req_zone $binary_remote_addr zone=preview:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' data: blob: http: https:; connect-src 'self' data: blob: http: https: ws: wss:; frame-src http://127.0.0.1:* https://www.youtube.com https://www.youtube-nocookie.com https://platform.twitter.com; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /preview/ {
        if ($http_sec_fetch_site != "same-origin") {
            return 403;
        }
        limit_req zone=preview burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081/;
        proxy_read_timeout 25s;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|jpg|jpeg|png|gif|svg|webp)$ {
        expires 30d;
        access_log off;
    }

    gzip on;
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/css application/json;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
}
